name: Build the desktop apps

# Push a tag like v1.2 and this builds the Windows installer and the Mac apps, then attaches them to a Release.
# You can also run it by hand (Actions tab > "Build the desktop apps" > Run workflow) to get the files without a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false          # one platform failing shouldn't stop the others
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest    # Apple silicon
            label: mac-apple-silicon
          - os: macos-15-intel  # Intel Macs
            label: mac-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install what the build needs
        shell: bash
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Inno Setup if this image doesn't have it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build and test the app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="dev-${GITHUB_RUN_NUMBER}"; fi
          python tools/build_desktop.py --version "$VERSION"

      - name: Name the Mac file by chip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for f in dist/*-mac.zip; do mv "$f" "${f%-mac.zip}-${{ matrix.label }}.zip"; done

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.label }}
          path: |
            dist/*-Setup.exe
            dist/*-windows-portable.zip
            dist/*-mac-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag' && !cancelled() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          pattern: app-*
          merge-multiple: true

      - name: Attach everything to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la files
          # a release you already made by hand for this tag just gets the files added
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" files/* --clobber
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" files/* \
            --title "Personal Finance Ledger ${GITHUB_REF_NAME}" \
            --notes "A desktop app. No code or Python needed. Windows: download the file ending in -Setup.exe and run it. Mac: download the zip for your chip (Apple silicon is any Mac from late 2020 on; older ones are Intel), unzip it and drag the app to Applications. The first time, Windows may say it protected your PC (choose More info, then Run anyway) and a Mac may say the app can't be checked (right-click it, choose Open, then Open). Your numbers are kept in one folder that updates never touch."
